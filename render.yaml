# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: maos-classroom
    runtime: static
    buildCommand: unzip -o aa-sites.zip
    staticPublishPath: ./maos
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: kelvin-choi-studio
    runtime: static
    buildCommand: sh build-kelvin.sh
    staticPublishPath: ./kelvin
